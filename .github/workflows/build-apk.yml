name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Java JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capacitor App-Shell konfigurieren
        run: |
          mkdir -p app-shell
          cat << 'HTMLEOF' > app-shell/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Talahons im Park</title>
          </head>
          <body style="margin:0; background:#000;"></body>
          </html>
          HTMLEOF

          cat << 'CFGEOF' > capacitor.config.json
          {
            "appId": "com.talahon.game",
            "appName": "Talahons im Park",
            "webDir": "app-shell",
            "server": {
              "url": "https://talahons-im-park.vercel.app",
              "cleartext": true
            }
          }
          CFGEOF

      - name: Android-Projekt mit Capacitor generieren
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: APK erzeugen (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Talahons-im-Park-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
