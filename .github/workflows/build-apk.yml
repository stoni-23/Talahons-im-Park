name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Java JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren & Spiel kompilieren
        run: |
          npm install --legacy-peer-deps
          npm run build || npx vite build || true

          # Garantieren, dass dist existiert und eine index.html enthält
          mkdir -p dist
          if [ ! -f "dist/index.html" ]; then
            echo "Kopiere Fallback-Dateien nach dist..."
            cp -r public/* dist/ 2>/dev/null || true
            cp -r assets dist/ 2>/dev/null || true
            cp index.html dist/ 2>/dev/null || true
          fi

      - name: Android-Container einrichten
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Talahons im Park" "com.talahon.game" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: APK erzeugen (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Talahons-im-Park-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
