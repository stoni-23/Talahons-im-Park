name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Java JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Node.js 20 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren & Spiel kompilieren
        run: |
          npm install --legacy-peer-deps
          npm run build || true
          
          # Sicherstellen, dass ein passender Web-Ordner existiert
          if [ -d "dist" ]; then
            echo "BUILD_DIR=dist" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            echo "BUILD_DIR=build" >> $GITHUB_ENV
          elif [ -d "public" ]; then
            echo "BUILD_DIR=public" >> $GITHUB_ENV
          else
            mkdir -p dist
            cp index.html dist/ 2>/dev/null || true
            echo "BUILD_DIR=dist" >> $GITHUB_ENV
          fi

      - name: Android-Container einrichten
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Talahons im Park" "com.talahon.game" --web-dir "$BUILD_DIR"
          npx cap add android
          npx cap sync android

      - name: APK erzeugen (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Talahons-im-Park-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
