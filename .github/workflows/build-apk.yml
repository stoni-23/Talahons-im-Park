name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Java JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capacitor App-Shell konfigurieren
        run: |
          mkdir -p app-shell
          cat << 'HTMLEOF' > app-shell/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Talahons im Park</title>
          </head>
          <body style="margin:0; background:#000;"></body>
          </html>
          HTMLEOF

          cat << 'CFGEOF' > capacitor.config.json
          {
            "appId": "com.talahon.game",
            "appName": "Talahons im Park",
            "webDir": "app-shell",
            "server": {
              "url": "https://talahons-im-park.vercel.app",
              "cleartext": true
            }
          }
          CFGEOF

      - name: Android-Projekt generieren
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Systemleisten & Fenster-Padding konfigurieren
        run: |
          cat << 'JAVAEOF' > android/app/src/main/java/com/talahon/game/MainActivity.java
          package com.talahon.game;

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  View content = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (view, windowInsets) -> {
                      Insets insets = windowInsets.getInsets(WindowInsetsCompat.Type.systemBars());
                      view.setPadding(insets.left, insets.top, insets.right, insets.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
              }
          }
          JAVAEOF

      - name: Splash-Screen Hintergrundfarbe auf Schwarz setzen (Android 12+)
        run: |
          mkdir -p android/app/src/main/res/values-v31
          cat << 'STYLESEOF' > android/app/src/main/res/values-v31/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:windowSplashScreenBackground">#000000</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@mipmap/ic_launcher</item>
              </style>
          </resources>
          STYLESEOF

          cat << 'STYLESEOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#000000</item>
                  <item name="colorPrimaryDark">#000000</item>
                  <item name="colorAccent">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:background">#000000</item>
              </style>
          </resources>
          STYLESEOF

      - name: Adaptive Icons mit schwarzem Hintergrund erzeugen
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          SRC="public/logo.png"
          [ ! -f "$SRC" ] && SRC="public/assets/logo.png"
          [ ! -f "$SRC" ] && SRC="assets/logo.png"

          # Farben definieren
          mkdir -p android/app/src/main/res/values
          cat << 'COLOREOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#000000</color>
          </resources>
          COLOREOF

          # Standard-Icons (für ältere Systeme)
          convert "$SRC" -background black -alpha remove -alpha off -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert "$SRC" -background black -alpha remove -alpha off -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # Adaptive Icon Definition (Android 8 bis Android 15+)
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat << 'ICONEOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher"/>
          </adaptive-icon>
          ICONEOF

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: APK erzeugen (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Talahons-im-Park.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Talahons-im-Park-APK
          path: android/app/build/outputs/apk/debug/Talahons-im-Park.apk
