name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Keystore & Build TWA APK
        run: |
          mkdir -p android-twa && cd android-twa
          
          # Erstelle Keystore für den Build
          keytool -genkeypair -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "android123" -keypass "android123" \
            -dname "CN=Talahons, OU=Game, O=Bankgeheimnis, L=Frankfurt, S=Hessen, C=DE"

          # Initialisiere Bubblewrap mit deiner URL
          bubblewrap init --manifest https://talahons.vercel.app/manifest.webmanifest || true

          # APK bauen
          bubblewrap build --signingKeyPath android.keystore --signingKeyAlias android || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talahons-park-apk
          path: |
            android-twa/*.apk
            android-twa/app-release-signed.apk
            android-twa/app-*.apk
          if-no-files-found: warn
